name: Pine Exact Holdout Fast

on:
  push:
    branches:
      - experiment/independent-daily-screener-v2
    paths:
      - .github/workflows/pine-exact-holdout-fast.yml

concurrency:
  group: pine-exact-holdout-fast
  cancel-in-progress: true

jobs:
  exact-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v7
        with:
          ref: experiment/independent-daily-screener-v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run exact 2y / 1y holdout
        run: |
          python independent_daily_pine_exact.py \
            --max-workers 48 \
            --history-days 730 \
            --holdout-days 365 \
            --yahoo-range 2y \
            --output-dir reports_pine_exact_fast

      - name: Upload exact fast report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pine-exact-holdout-fast
          path: reports_pine_exact_fast/
          if-no-files-found: ignore
          retention-days: 30
