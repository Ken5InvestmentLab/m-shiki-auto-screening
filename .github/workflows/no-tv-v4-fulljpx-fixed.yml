name: No-TV V4 Strict Fixed Full-JPX Pre-2026

on:
  push:
    branches:
      - experiment/no-tv-v4-fulljpx-fixed
    paths:
      - no_tv_v4_fulljpx_fixed.py
      - no_tv_v4_entry_realism.py
      - no_tv_daily_v4_regime.py
      - no_tv_daily_v3.py
      - .github/workflows/no-tv-v4-fulljpx-fixed.yml
  workflow_dispatch:

concurrency:
  group: no-tv-v4-fulljpx-fixed
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-v4-fulljpx-fixed
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v3.txt
      - run: python -m pip install -r requirements-v3.txt
      - run: python -m py_compile no_tv_v4_fulljpx_fixed.py no_tv_v4_entry_realism.py no_tv_daily_v4_regime.py no_tv_daily_v3.py
      - name: Run strict fixed full-JPX pre-2026 validation
        run: |
          python no_tv_v4_fulljpx_fixed.py \
            --end-date 2025-12-30 \
            --max-workers 32 \
            --history-days 1825 \
            --holdout-days 365 \
            --output-dir reports_no_tv_v4_fulljpx_fixed
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-v4-fulljpx-fixed-pre2026
          path: reports_no_tv_v4_fulljpx_fixed/
          if-no-files-found: ignore
          retention-days: 14
