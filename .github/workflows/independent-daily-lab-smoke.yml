name: Independent Daily Screener Lab Smoke

on:
  push:
    branches:
      - experiment/independent-daily-screener-v1
    paths:
      - independent_daily_lab.py
      - screen_big_money.py
      - screen_entry.py
      - requirements.txt
      - .github/workflows/independent-daily-lab-smoke.yml
  workflow_dispatch:
    inputs:
      max_issues:
        description: "Smoke-test universe size"
        required: false
        default: "300"

concurrency:
  group: independent-daily-lab-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v7
        with:
          ref: experiment/independent-daily-screener-v1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile independent_daily_lab.py screen_big_money.py screen_entry.py

      - name: Run isolated smoke test
        run: |
          MAX_ISSUES="${{ github.event.inputs.max_issues || '300' }}"
          python independent_daily_lab.py \
            --max-issues "$MAX_ISSUES" \
            --max-workers 24 \
            --output-dir reports_independent_lab

      - name: Upload lab report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-daily-lab-smoke
          path: reports_independent_lab/
          if-no-files-found: ignore
          retention-days: 14
