name: No-TV Daily V3 Smoke

on:
  push:
    branches:
      - experiment/no-tv-research-v3
    paths:
      - no_tv_daily_v3.py
      - requirements-v3.txt
      - .github/workflows/no-tv-daily-v3-smoke.yml
  workflow_dispatch:

concurrency:
  group: no-tv-daily-v3-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-research-v3

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v3.txt

      - name: Install
        run: python -m pip install -r requirements-v3.txt

      - name: Compile
        run: python -m py_compile no_tv_daily_v3.py independent_daily_lab_v2.py

      - name: Run V3 smoke
        run: |
          python no_tv_daily_v3.py             --max-issues 300             --max-workers 24             --history-days 1825             --holdout-days 365             --output-dir reports_no_tv_v3

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-daily-v3-smoke
          path: reports_no_tv_v3/
          if-no-files-found: ignore
          retention-days: 14
