name: No-TV MShiki Stable Smoke

on:
  push:
    branches:
      - experiment/no-tv-research-v3
    paths:
      - no_tv_mshiki_stable_lab.py
      - .github/workflows/no-tv-mshiki-stable-smoke.yml
  workflow_dispatch:

concurrency:
  group: no-tv-mshiki-stable-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-research-v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v3.txt
      - run: python -m pip install -r requirements-v3.txt
      - run: python -m py_compile no_tv_mshiki_stable_lab.py
      - name: Run MShiki Stable smoke
        run: |
          python no_tv_mshiki_stable_lab.py             --max-issues 300             --max-workers 24             --history-days 1825             --holdout-days 365             --output-dir reports_no_tv_mshiki
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-mshiki-stable-smoke
          path: reports_no_tv_mshiki/
          if-no-files-found: ignore
          retention-days: 14
