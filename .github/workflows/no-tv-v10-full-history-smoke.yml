name: No-TV V10 Full History Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/no-tv-distillation-v10
    paths:
      - no_tv_v10_full_history.py
      - no_tv_v10_features.py
      - experiments/v10_teacher_full_bottom.csv.gz
      - .github/workflows/no-tv-v10-full-history-smoke.yml

concurrency:
  group: no-tv-v10-full-history-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-distillation-v10
          fetch-depth: 1
      - name: Clone exact historical watchlists
        run: git clone --quiet https://github.com/Ken5InvestmentLab/tv-watchlist-builder.git tv-watchlist-builder-history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v3.txt
      - run: python -m pip install -r requirements-v3.txt
      - run: python -m py_compile no_tv_v10_features.py no_tv_v10_full_history.py
      - name: Run full-history smoke
        run: |
          python no_tv_v10_full_history.py \
            --watchlist-repo tv-watchlist-builder-history \
            --max-symbols 350 \
            --max-workers 20 \
            --output-dir reports_no_tv_v10_full
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-v10-full-history-smoke
          path: reports_no_tv_v10_full/
          if-no-files-found: ignore
          retention-days: 14
