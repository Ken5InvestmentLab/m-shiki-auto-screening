name: M式自動スクリーニング

on:
  workflow_dispatch:
    inputs:
      no_wait:
        description: "Skip waiting until 15:52 JST for manual runs"
        required: false
        default: "true"
      dry_run:
        description: "Do not post to Discord"
        required: false
        default: "false"
      allow_stale_data:
        description: "Run even when Yahoo latest date is older than today"
        required: false
        default: "false"
      as_of_date:
        description: "Backtest using OHLCV bars on or before YYYY-MM-DD"
        required: false
        default: ""
      run_at_jst:
        description: "Override run timestamp, e.g. 2026-07-02T15:52:00"
        required: false
        default: ""
      lookback_days:
        description: "Include reactions this many calendar days before the latest market date"
        required: false
        default: "0"
      history_start_date:
        description: "Historical backfill start date. Blank = normal daily screening"
        required: false
        default: ""
      history_end_date:
        description: "Historical backfill end date. Blank = today JST"
        required: false
        default: ""

concurrency:
  group: big-money-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run screening
        if: ${{ github.event.inputs.history_start_date == '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.no_wait }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-wait"
          fi
          if [ "${{ github.event.inputs.allow_stale_data }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --allow-stale-data"
          fi
          if [ -n "${{ github.event.inputs.as_of_date }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --as-of-date ${{ github.event.inputs.as_of_date }}"
          fi
          if [ -n "${{ github.event.inputs.run_at_jst }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --run-at-jst ${{ github.event.inputs.run_at_jst }}"
          fi
          if [ -n "${{ github.event.inputs.lookback_days }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --lookback-days ${{ github.event.inputs.lookback_days }}"
          fi
          python screen_entry.py \
            --wait-until 15:52 \
            --max-results 20 \
            --retry-until-updated-minutes 20 \
            --retry-interval-seconds 120 \
            $EXTRA_ARGS

      - name: Run historical backfill
        if: ${{ github.event.inputs.history_start_date != '' }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.history_end_date }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --end-date ${{ github.event.inputs.history_end_date }}"
          fi
          python backfill_history.py \
            --start-date "${{ github.event.inputs.history_start_date }}" \
            --max-results-per-day 20 \
            $EXTRA_ARGS

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: big-money-screening-report
          path: |
            reports/
            reports_backfill/
          if-no-files-found: ignore
          retention-days: 14