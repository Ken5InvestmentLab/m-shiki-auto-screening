name: No-TV Multi-TF Smoke

on:
  push:
    branches: [experiment/no-tv-research-v3]
    paths:
      - no_tv_multitf_state_lab.py
      - .github/workflows/no-tv-multitf-smoke.yml
  workflow_dispatch:

concurrency:
  group: no-tv-multitf-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-research-v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v3.txt
      - run: python -m pip install -r requirements-v3.txt
      - run: python -m py_compile no_tv_multitf_state_lab.py
      - name: Run multi-TF smoke
        run: |
          python no_tv_multitf_state_lab.py             --max-issues 200             --max-workers 20             --history-days 720             --holdout-days 365             --output-dir reports_no_tv_multitf
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-multitf-smoke
          path: reports_no_tv_multitf/
          if-no-files-found: ignore
          retention-days: 14
