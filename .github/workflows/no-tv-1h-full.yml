name: No-TV Yahoo 1H Full

on:
  push:
    branches:
      - experiment/no-tv-research-v3
    paths:
      - no_tv_1h_lab.py
      - .github/workflows/no-tv-1h-full.yml
  workflow_dispatch:

concurrency:
  group: no-tv-1h-full
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-research-v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v3.txt
      - run: python -m pip install -r requirements-v3.txt
      - run: python -m py_compile no_tv_1h_lab.py
      - name: Run full market 1H
        run: |
          python no_tv_1h_lab.py             --max-workers 48             --history-days 720             --holdout-days 365             --output-dir reports_no_tv_1h
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-1h-full
          path: reports_no_tv_1h/
          if-no-files-found: ignore
          retention-days: 30
