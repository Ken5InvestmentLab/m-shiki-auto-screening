name: No-TV V6 Session Smoke

on:
  push:
    branches: [experiment/no-tv-research-v3]
    paths:
      - no_tv_v6_sessions.py
      - .github/workflows/no-tv-v6-session-smoke.yml
  workflow_dispatch:

concurrency:
  group: no-tv-v6-session-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-research-v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v3.txt
      - run: python -m pip install -r requirements-v3.txt
      - run: python -m py_compile no_tv_v6_sessions.py
      - name: Run V6 session smoke
        run: |
          python no_tv_v6_sessions.py \
            --max-issues 250 \
            --max-workers 24 \
            --history-days 720 \
            --holdout-days 365 \
            --output-dir reports_no_tv_v6
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-v6-session-smoke
          path: reports_no_tv_v6/
          if-no-files-found: ignore
          retention-days: 14
