name: Independent Daily Screener V2 Smoke

on:
  push:
    branches:
      - experiment/independent-daily-screener-v2
    paths:
      - independent_daily_lab_v2.py
      - .github/workflows/independent-daily-lab-v2-smoke.yml
  workflow_dispatch:

concurrency:
  group: independent-daily-lab-v2-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v7
        with:
          ref: experiment/independent-daily-screener-v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile independent_daily_lab_v2.py screen_big_money.py screen_entry.py

      - name: Run V2 smoke
        run: |
          python independent_daily_lab_v2.py \
            --max-issues 250 \
            --max-workers 24 \
            --history-days 1825 \
            --holdout-days 365 \
            --output-dir reports_independent_lab_v2

      - name: Upload V2 smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-daily-lab-v2-smoke
          path: reports_independent_lab_v2/
          if-no-files-found: ignore
          retention-days: 14
