name: No-TV 1H AsOf Stable Full

on:
  push:
    branches: [experiment/no-tv-research-v3]
    paths:
      - .github/workflows/no-tv-1h-asof-full.yml
  workflow_dispatch:

concurrency:
  group: no-tv-1h-asof-full
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-research-v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v3.txt
      - run: python -m pip install -r requirements-v3.txt
      - run: python -m py_compile no_tv_1h_asof_stable.py
      - name: Run full market AsOf Stable
        run: |
          python no_tv_1h_asof_stable.py \
            --max-workers 48 \
            --history-days 720 \
            --holdout-days 365 \
            --output-dir reports_no_tv_1h_asof
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-1h-asof-full
          path: reports_no_tv_1h_asof/
          if-no-files-found: ignore
          retention-days: 30
