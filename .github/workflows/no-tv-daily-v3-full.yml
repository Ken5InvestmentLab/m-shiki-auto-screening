name: No-TV Daily V3 Full

on:
  push:
    branches:
      - experiment/no-tv-research-v3
    paths:
      - .github/workflows/no-tv-daily-v3-full.yml
  workflow_dispatch:

concurrency:
  group: no-tv-daily-v3-full
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-research-v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v3.txt
      - run: python -m pip install -r requirements-v3.txt
      - run: python -m py_compile no_tv_daily_v3.py
      - name: Run full market V3
        run: |
          python no_tv_daily_v3.py             --max-workers 48             --history-days 1825             --holdout-days 365             --output-dir reports_no_tv_v3
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-daily-v3-full
          path: reports_no_tv_v3/
          if-no-files-found: ignore
          retention-days: 30
