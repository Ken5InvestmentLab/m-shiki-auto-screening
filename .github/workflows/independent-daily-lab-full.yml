name: Independent Daily Screener Lab Full

on:
  push:
    branches:
      - experiment/independent-daily-screener-v1
    paths:
      - .github/workflows/independent-daily-lab-full.yml

concurrency:
  group: independent-daily-lab-full
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v7
        with:
          ref: experiment/independent-daily-screener-v1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile independent_daily_lab.py screen_big_money.py screen_entry.py

      - name: Run full isolated one-year comparison
        run: |
          python independent_daily_lab.py \
            --max-workers 32 \
            --output-dir reports_independent_lab

      - name: Upload full lab report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-daily-lab-full
          path: reports_independent_lab/
          if-no-files-found: ignore
          retention-days: 30
