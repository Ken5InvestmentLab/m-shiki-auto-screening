name: No-TV Monster Weak+Early Frozen Pre-2026 Smoke

on:
  push:
    branches:
      - experiment/no-tv-monster-weak-early-pre2026
    paths:
      - no_tv_monster_weak_early_pre2026.py
      - .github/workflows/no-tv-monster-weak-early-pre2026-smoke.yml
  workflow_dispatch:

concurrency:
  group: no-tv-monster-weak-early-pre2026-smoke
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-monster-weak-early-pre2026
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-v3.txt
      - run: python -m pip install -r requirements-v3.txt
      - run: python -m py_compile no_tv_monster_weak_early_pre2026.py no_tv_daily_v31.py no_tv_daily_v3.py
      - name: Run frozen weak+early transfer test on pre-2026 data
        run: |
          python no_tv_monster_weak_early_pre2026.py \
            --end-date 2025-12-30 \
            --history-days 1825 \
            --holdout-days 365 \
            --max-issues 400 \
            --max-workers 24 \
            --output-dir reports_no_tv_monster_weak_early_pre2026
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-monster-weak-early-pre2026-smoke
          path: reports_no_tv_monster_weak_early_pre2026/
          if-no-files-found: ignore
          retention-days: 14
